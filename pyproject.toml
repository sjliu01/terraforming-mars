[project]
name = "backend-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["fastapi[standard]>=0.128.8"]

[dependency-groups]
dev = ["ruff>=0.15.21", "pyright>=1.1.400"]

[tool.fastapi]
entrypoint = "src.lib.server.main:app"

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
# isort, pyupgrade, bugbear on top of the E/F defaults
extend-select = ["I", "UP", "B"]

[tool.pyright]
include = ["src/lib/server"]
venvPath = "."
venv = ".venv"
