components:
  schemas:
    CardDescription:
      properties:
        base_cost:
          title: Base Cost
          type: integer
        id:
          title: Id
          type: integer
        name:
          title: Name
          type: string
        tags:
          items:
            $ref: '#/components/schemas/Tag'
          title: Tags
          type: array
        version:
          $ref: '#/components/schemas/Version'
      required:
      - id
      - name
      - base_cost
      - tags
      - version
      title: CardDescription
      type: object
    CardState:
      properties:
        action_used:
          title: Action Used
          type: boolean
        num_resources:
          title: Num Resources
          type: integer
        resources_can_be_taken:
          title: Resources Can Be Taken
          type: boolean
      required:
      - num_resources
      - action_used
      - resources_can_be_taken
      title: CardState
      type: object
    CorporationDescription:
      properties:
        id:
          title: Id
          type: integer
        name:
          title: Name
          type: string
        tags:
          items:
            $ref: '#/components/schemas/Tag'
          title: Tags
          type: array
        version:
          $ref: '#/components/schemas/Version'
      required:
      - id
      - name
      - tags
      - version
      title: CorporationDescription
      type: object
    GameState:
      properties:
        all_cards:
          items:
            type: string
          title: All Cards
          type: array
        board_state:
          additionalProperties:
            $ref: '#/components/schemas/TileState'
          title: Board State
          type: object
        cur_generation:
          title: Cur Generation
          type: integer
        deck:
          items:
            type: string
          title: Deck
          type: array
        generation_state:
          $ref: '#/components/schemas/GenerationState'
        global_parameter_progress:
          additionalProperties:
            type: number
          propertyNames:
            $ref: '#/components/schemas/GlobalParameter'
          title: Global Parameter Progress
          type: object
        global_parameter_targets:
          additionalProperties:
            type: number
          propertyNames:
            $ref: '#/components/schemas/GlobalParameter'
          title: Global Parameter Targets
          type: object
        player_state:
          items:
            $ref: '#/components/schemas/PlayerState'
          title: Player State
          type: array
      required:
      - all_cards
      - deck
      - player_state
      - board_state
      - generation_state
      - global_parameter_targets
      - global_parameter_progress
      - cur_generation
      title: GameState
      type: object
    GenerationState:
      properties:
        first_player:
          title: First Player
          type: integer
        passed:
          items:
            type: boolean
          title: Passed
          type: array
        phase:
          $ref: '#/components/schemas/Phase'
      required:
      - phase
      - first_player
      - passed
      title: GenerationState
      type: object
    GetCardsResponse:
      properties:
        cards:
          items:
            $ref: '#/components/schemas/CardDescription'
          title: Cards
          type: array
      required:
      - cards
      title: GetCardsResponse
      type: object
    GetCorporationsResponse:
      properties:
        cards:
          items:
            $ref: '#/components/schemas/CorporationDescription'
          title: Cards
          type: array
      required:
      - cards
      title: GetCorporationsResponse
      type: object
    GetTilesResponse:
      properties:
        cards:
          items:
            $ref: '#/components/schemas/TileDescription'
          title: Cards
          type: array
      required:
      - cards
      title: GetTilesResponse
      type: object
    GlobalParameter:
      enum:
      - ocean
      - oxygen
      - temperature
      title: GlobalParameter
      type: string
    MessageResponse:
      properties:
        message:
          title: Message
          type: string
      required:
      - message
      title: MessageResponse
      type: object
    Phase:
      enum:
      - turn_order
      - research
      - action
      - production
      - final_production
      - final_greenery
      title: Phase
      type: string
    Planet:
      enum:
      - mars
      - phobos
      - ganymede
      title: Planet
      type: string
    PlayerState:
      properties:
        corporation:
          anyOf:
          - type: string
          - type: 'null'
          title: Corporation
        hand:
          items:
            type: string
          title: Hand
          type: array
        production:
          additionalProperties:
            type: integer
          propertyNames:
            $ref: '#/components/schemas/Resource'
          title: Production
          type: object
        resources:
          additionalProperties:
            type: integer
          propertyNames:
            $ref: '#/components/schemas/Resource'
          title: Resources
          type: object
        tableau:
          additionalProperties:
            $ref: '#/components/schemas/CardState'
          title: Tableau
          type: object
        terraform_rating:
          title: Terraform Rating
          type: integer
      required:
      - corporation
      - hand
      - tableau
      - production
      - resources
      - terraform_rating
      title: PlayerState
      type: object
    Resource:
      enum:
      - mega_credits
      - steel
      - titanium
      - plant
      - energy
      - heat
      title: Resource
      type: string
    Tag:
      enum:
      - animal
      - building
      - city
      - earth
      - event
      - jovian
      - microbe
      - plant
      - power
      - science
      - space
      title: Tag
      type: string
    TileDescription:
      properties:
        card_bonuses:
          title: Card Bonuses
          type: integer
        is_reserved_for_ocean:
          title: Is Reserved For Ocean
          type: boolean
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        planet:
          $ref: '#/components/schemas/Planet'
        q:
          title: Q
          type: integer
        r:
          title: R
          type: integer
        resource_bonuses:
          items:
            $ref: '#/components/schemas/Resource'
          title: Resource Bonuses
          type: array
      required:
      - q
      - r
      - planet
      - name
      - resource_bonuses
      - card_bonuses
      - is_reserved_for_ocean
      title: TileDescription
      type: object
    TileState:
      properties:
        owner:
          anyOf:
          - type: integer
          - type: 'null'
          title: Owner
        reserved_by:
          anyOf:
          - type: integer
          - type: 'null'
          title: Reserved By
        tile:
          anyOf:
          - $ref: '#/components/schemas/TileType'
          - type: 'null'
      required:
      - tile
      - owner
      - reserved_by
      title: TileState
      type: object
    TileType:
      enum:
      - city
      - greenery
      - ocean
      - special
      title: TileType
      type: string
    Version:
      enum:
      - base
      - corporate_era
      title: Version
      type: string
info:
  title: FastAPI
  version: 0.1.0
openapi: 3.1.0
paths:
  /api/data/cards/:
    get:
      operationId: get_cards_api_data_cards__get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetCardsResponse'
          description: Successful Response
      summary: Get Cards
  /api/data/corporations/:
    get:
      operationId: get_corporations_api_data_corporations__get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetCorporationsResponse'
          description: Successful Response
      summary: Get Corporations
  /api/data/tiles/:
    get:
      operationId: get_tiles_api_data_tiles__get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetTilesResponse'
          description: Successful Response
      summary: Get Tiles
  /api/message/:
    get:
      operationId: get_message_api_message__get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
          description: Successful Response
      summary: Get Message
  /api/state/init:
    get:
      operationId: get_initial_game_state_api_state_init_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameState'
          description: Successful Response
      summary: Get Initial Game State
